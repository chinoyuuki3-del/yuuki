<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>AF-4 LOGIN</title><style>*{box-sizing:border-box}body{background:#0b1724;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;margin:0}.login{max-width:360px;margin:13vh auto;background:#172a3a;border-top:4px solid #3489d6;padding:25px}h1{font-size:44px;font-weight:300;letter-spacing:5px;margin:0}p{color:#9ab5c9;font-size:13px}label{display:block;margin:22px 0 8px;font-size:13px}input{width:100%;padding:14px;border:1px solid #44627c;border-radius:0;background:#091826;color:white;font-size:16px}button{width:100%;margin-top:15px;padding:15px;background:#236ead;color:#fff;border:0;border-radius:0;font-size:15px}.error{color:#ff9e9e;font-size:12px}</style></head><body><div class="login"><div style="color:#59bdfb;font-size:12px">SECURE SMART BASE</div><h1>AF-4</h1><p>コントロールパネルの管理者ログイン</p>{% if error %}<p class="error">{{ error }}</p>{% endif %}<form method="post"><label>管理者パスワード</label><input name="password" type="password" autocomplete="current-password" required><button type="submit">ログイン</button></form><p>ライブ映像やログはログイン後にのみ表示されます。</p></div></body></html>
