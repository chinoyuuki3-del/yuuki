<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#081225"><meta name="description" content="ゲーム・機械・工作の動画SNS"><title>BOYS HUB | 動画SNS</title><link rel="stylesheet" href="/static/style.css"></head>
<body>
<div id="toast" role="status" aria-live="polite"></div>
<section id="auth" class="auth-screen">
 <div class="orb orb1"></div><div class="orb orb2"></div>
 <div class="auth-card">
  <div class="brand"><span class="brand-icon">B</span><span>BOYS <em>HUB</em></span></div>
  <div class="tag">⚡ VIDEO COMMUNITY</div>
  <h1>好きな動画に、<br><span class="gradient">夢中になろう。</span></h1>
  <p class="muted">ゲーム・機械・工作・おもしろ動画を集める、小さな動画SNS。</p>
  <div class="segmented"><button id="tabLogin" class="selected" type="button">ログイン</button><button id="tabRegister" type="button">新規登録</button></div>
  <form id="authForm">
   <label for="username">ユーザー名</label><input id="username" autocomplete="username" maxlength="24" placeholder="ニックネーム" required>
   <label for="password">自分のパスワード</label><input id="password" type="password" autocomplete="current-password" minlength="8" maxlength="128" placeholder="8文字以上" required>
   <div id="inviteWrap" hidden><label for="invite">招待コード</label><input id="invite" autocomplete="off" placeholder="招待コードを入力"></div>
   <p id="authError" class="error" aria-live="polite"></p><button class="primary wide" id="authButton" type="submit">ログイン →</button>
  </form>
  <div class="footnote">🔒 実名、学校名、住所は入力しないでね。<br>招待コードは性別・年齢の本人確認ではありません。</div>
 </div>
</section>
<div id="app" hidden>
 <header class="topbar"><div class="top-inner"><div class="brand"><span class="brand-icon">B</span><span>BOYS <em>HUB</em></span></div><div class="top-right"><span class="status-tag">● LIVE SNS</span><span class="user-bubble" id="userBubble">U</span><span class="my-name" id="myName">ユーザー</span><button class="outline" id="logout">ログアウト</button></div></div></header>
 <div class="layout"><aside class="side"><nav class="panel nav" id="nav">
  <button class="nav-button active" data-view="feed">⌂ <span>おすすめ</span></button>
  <button class="nav-button" data-view="post">⊕ <span>動画を投稿</span></button>
  <button class="nav-button" data-view="mine">▤ <span>マイ投稿</span></button>
  <button class="nav-button" data-view="rules">⚑ <span>ルール</span></button>
  <button class="nav-button admin-link" data-view="admin" hidden>♜ <span>管理パネル</span></button>
 </nav><div class="side-tip">🛠️ <b>好きなジャンルを見よう</b><br>ゲーム、機械、工作などを楽しめるSNS。気になる投稿は通報できるよ。</div></aside>
 <main id="main" aria-live="polite"></main>
 <aside class="right"><div class="panel info"><h3>⚡ 話題のジャンル</h3><p>🎮 ゲーム</p><p>⚙️ 機械</p><p>🛠️ 工作</p><p>🤣 おもしろ</p></div><div class="panel info"><h3>🛡️ 安全について</h3><p class="muted">顔・制服・住所・位置がわかる情報は投稿しないでね。迷惑な投稿は通報、管理者は削除できます。</p></div></aside>
 </div>
 <nav class="mobile-nav" aria-label="メニュー"><button data-view="feed">⌂<small>おすすめ</small></button><button data-view="post">⊕<small>投稿</small></button><button data-view="mine">▤<small>マイ投稿</small></button><button data-view="rules">⚑<small>ルール</small></button><button class="admin-link" data-view="admin" hidden>♜<small>管理</small></button></nav>
</div>
<script src="/static/app.js" defer></script>
</body></html>
