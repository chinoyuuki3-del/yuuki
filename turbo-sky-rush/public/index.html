</head><body><div id="root"><div style="color:#c8f7ff;background:#060912;min-height:100vh;display:grid;place-items:center;font-size:20px">🏎️ TURBO SKY RUSH を起動中...</div></div>
<script type="module">
(async () => {
  const host = document.getElementById('root');
  try {
    const [react, dom, app] = await Promise.all([
      import('react'), import('react-dom/client'), import('@/components/GameApp')
    ]);
    dom.createRoot(host).render(react.createElement(app.default));
  } catch (error) {
    console.error('TURBO SKY RUSH startup failed', error);
    host.replaceChildren();
    const box = document.createElement('div');
    box.style.cssText = 'box-sizing:border-box;min-height:100vh;background:#060912;color:#e2e8f0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;gap:14px;font-family:system-ui,sans-serif';
    const title = document.createElement('h2');
    title.textContent = '⚠️ ゲームの読み込みに失敗しました';
    const detail = document.createElement('p');
    detail.style.cssText = 'max-width:550px;overflow-wrap:anywhere';
    detail.textContent = '必要なJavaScriptを読み込めませんでした。インターネット接続とブラウザを確認してね。詳細: ' + String(error && error.message || error);
    const button = document.createElement('button');
    button.textContent = '🔄 再読み込み';
    button.style.cssText = 'border:0;border-radius:12px;background:#0891b2;padding:12px 24px;color:white;font-weight:bold;cursor:pointer';
    button.onclick = () => location.reload();
    const link = document.createElement('a');
    link.href = window.TSR_SERVER || 'https://turbo-sky-rush-yuuki.onrender.com';
    link.textContent = '公開サイトで開く';
    link.style.color = '#67e8f9';
    box.append(title, detail, button, link);
    host.appendChild(box);
  }
})();
</script><noscript>このゲームを遊ぶには JavaScript が必要です。</noscript></body></html>
