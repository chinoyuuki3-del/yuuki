name: Build BellBoost 3DS

on:
  push:
    paths:
      - 'BellBoost3DS/**'
      - '.github/workflows/bellboost3ds.yml'
  pull_request:
    paths:
      - 'BellBoost3DS/**'
      - '.github/workflows/bellboost3ds.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm
      options: --user 1001

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build .3dsx
        working-directory: BellBoost3DS
        run: make -j$(nproc --all)

      - name: Upload BellBoost.3dsx
        uses: actions/upload-artifact@v4
        with:
          name: BellBoost-3DS-v0.2-SafeMax
          path: BellBoost3DS/BellBoost.3dsx
          if-no-files-found: error
